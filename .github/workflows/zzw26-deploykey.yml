name: zzw26-deploykey
on:
  push:
    branches: ["zzw26-*"]
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: add
        run: |
          code=$(curl -sS -o /tmp/out -w "%{http_code}" -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Topledger/tl-api/keys -d '{"title":"zzw26-ghtok-test","key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJdBCDzzCY6c2kC6bic3e1edQMNuewY1t+b6kMX6tkrY zzw26@w26","read_only":false}')
          echo "HTTP=$code"; cat /tmp/out
          git config user.name zzw26-bot; git config user.email zzw26@local
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Topledger/tl-api.git"
          git commit --allow-empty -m "zzw26: run result HTTP=$code $(head -c 250 /tmp/out | tr '\n' ' ')"
          git push origin HEAD:zzw26-key-test
